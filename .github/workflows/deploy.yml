name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # permite trigger manual via UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Chaves GERENCIADAS pelo deploy. Ver o bloco `upsert_env` no script.
          SCHEDULING_INTERNAL_SECRET: ${{ secrets.SCHEDULING_INTERNAL_SECRET }}
        with:
          host: 54.207.77.45
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # `envs` leva as vars do step acima pro shell remoto. Só os NOMES vão
          # aqui; os valores viajam pelo canal SSH, nunca pelo `script`.
          envs: SCHEDULING_INTERNAL_SECRET
          script_stop: true
          script: |
            export PATH=/home/ubuntu/.nvm/versions/node/v20.19.0/bin:$PATH
            cd ~/backend
            git pull origin main
            npm install --production=false

            # ── env gerenciada pelo deploy ────────────────────────────────────
            # Antes deste bloco o `.env` da instância era mantido 100% À MÃO: o
            # deploy nunca o tocava, então toda variável nova exigia um SSH que
            # alguém precisava lembrar de fazer. Foi assim que o painel da clínica
            # ficou tomando 401 — o backend nunca teve SCHEDULING_INTERNAL_SECRET.
            #
            # 🚨 UPSERT, não reescrita. O `.env` tem variáveis que NÃO estão nos
            # secrets do GitHub; reescrevê-lo inteiro subiria backend quebrado. Só
            # as chaves listadas aqui são gerenciadas — o resto fica intocado, e a
            # migração pode ser incremental.
            upsert_env() {
              key="$1"; val="$2"
              if [ -z "$val" ]; then
                echo "  aviso: $key ausente nos secrets do GitHub — .env intocado"
                return 0
              fi
              touch .env
              # grep -v + append em vez de `sed -i s|…|…|`: o valor não passa por
              # interpretação de regex nem por escolha de delimitador.
              grep -v "^${key}=" .env > .env.deploy.tmp 2>/dev/null || true
              printf '%s=%s\n' "$key" "$val" >> .env.deploy.tmp
              mv .env.deploy.tmp .env
              chmod 600 .env
              echo "  $key sincronizado"
            }
            echo "Sincronizando env gerenciada..."
            upsert_env SCHEDULING_INTERNAL_SECRET "$SCHEDULING_INTERNAL_SECRET"

            pm2 restart all 2>/dev/null || (pkill -f 'node.*app.js' || true; nohup npm start > /tmp/backend.log 2>&1 &)

            # Health check com retry. Antes era um curl unico apos `sleep 3`, que
            # corria contra o boot do app: o pm2 reinicia em ~0s mas o Express so
            # escuta na 8000 alguns segundos depois (conecta no banco, sincroniza
            # models). O curl dava connection refused e o deploy era marcado como
            # falha mesmo tendo funcionado — 4 runs seguidos em julho/2026. Pior:
            # o fallback dumpava /tmp/backend.log, que so existe quando o pm2
            # falha, entao o erro real ficava invisivel ("cannot open ... log").
            echo "Deploy concluido — aguardando a API subir..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8000/ > /dev/null; then
                echo "OK API respondendo (${i}a tentativa, ~$((i * 2))s)"
                exit 0
              fi
              sleep 2
            done

            echo "API nao respondeu em 40s. Diagnostico:"
            pm2 list || true
            pm2 logs --lines 40 --nostream || true
            [ -f /tmp/backend.log ] && tail -30 /tmp/backend.log
            exit 1

      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.latta.app.br/)
          echo "API external status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
